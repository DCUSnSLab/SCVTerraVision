[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terravision"
version = "0.0.0"
description = "Foundation-model-based perception stack for mobility robots (campus / urban / off-road / farmland)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Software and System Laboratory, Daegu Catholic University" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
]

# NOTE: PyTorch / CUDA versions are intentionally NOT pinned here.
# They must be installed separately against the correct CUDA build
# (see docs/progress/phase0.md). All other runtime deps are listed below.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "transformers>=4.56",
    "huggingface_hub>=0.24",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.17",
    "pycocotools>=2.0.7",
    "boxmot>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.3",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/marsberry/SCVTerraVision"

[tool.setuptools]
# Phase 0 is docs/config only; no importable package is shipped yet.
# Each source directory becomes a package in Phase 1+ via __init__.py files.
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
extend-exclude = "/(data|notebooks)/"
