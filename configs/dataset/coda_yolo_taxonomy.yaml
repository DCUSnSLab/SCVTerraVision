# Raw CoDA class names → YOLO id (single-step lookup used by the converter).
# Vehicle dispatch is encoded directly here — Car→2, Bus→5, Truck variants→7,
# Service/Utility Vehicle→89, Golf Cart→90.
coda_raw_to_yolo:
  # 0 person
  Pedestrian: 0
  # 1 bicycle
  Bike: 1
  # 3 motorcycle
  Motorcycle: 3
  # 80 scooter (wheeled-board group, sub-pedestrian speed)
  Scooter: 80
  Segway: 80
  Skateboard: 80
  # Vehicle dispatch — COCO car / bus / truck shape buckets, plus campus
  # service_vehicle / golf_cart for shapes that look unlike any COCO vehicle.
  Car: 2
  Truck: 7
  Bus: 5
  "Pickup Truck": 7
  "Delivery Truck": 7
  "Service Vehicle": 89
  "Utility Vehicle": 89
  "Golf Cart": 90
  # 81 tree
  Tree: 81
  # 82 pole
  Pole: 82
  # 9 traffic light
  "Traffic Light": 9
  # 83 sign (Phase 1-3 keeps signs merged; split deferred to a future phase)
  "Traffic Sign": 83
  "Informational Sign": 83
  "Room Label": 83
  "Wall Sign": 83
  "Floor Sign": 83
  # 84 bollard
  Bollard: 84
  # 85 cone
  Cone: 85
  # 86 barrier (linear static obstacles)
  "Construction Barrier": 86
  Fence: 86
  Railing: 86
  Stanchion: 86
  "Traffic Arm": 86
  # 87 bike_rack
  "Bike Rack": 87
  # 13 bench (COCO native)
  Bench: 13
  # 88 trash_can
  "Trash Can": 88
  Dumpster: 88
  # 10 fire hydrant (COCO native)
  "Fire Hydrant": 10

# Identical to coda_taxonomy.yaml's drop list — Phase 1-3 inherits the same
# decisions about indoor / single-sequence / overhead-structure classes.
coda_dropped:
  - "Canopy"
  - "Parking Kiosk"
  - "Mailbox"
  - "Freestanding Plant"
  - "Door"
  - "Chair"
  - "Table"
  - "Newspaper Dispenser"
  - "Sanitizer Dispenser"
  - "Condiment Dispenser"
  - "Vending Machine"
  - "Emergency Aid Kit"
  - "Fire Extinguisher"
  - "Computer"
  - "Television"
  - "Other"
  - "Horse"
  - "Fire Alarm"
  - "ATM"
  - "Cart"
  - "Couch"
  - "Door Switch"
  - "Emergency Phone"
  - "Vacuum Cleaner"
  - "Water Fountain"

# Operational 16-class id (coda_taxonomy.yaml) → YOLO id. Documentation only;
# the converter uses coda_raw_to_yolo directly. Use this for sanity checks
# and to confirm the operational projection is preserved 1:1 (except for the
# vehicle-dispatch group, which is intentionally subtype-aware in YOLO).
operational_to_yolo:
  1: 0           # pedestrian → person
  2: 1           # bicycle
  3: 3           # motorcycle
  4: 80          # scooter
  5: __DISPATCH__   # vehicle → 2/5/7/89/90 by raw subtype
  6: 81          # tree
  7: 82          # pole
  8: 9           # traffic_light
  9: 83          # sign
  10: 84         # bollard
  11: 85         # cone
  12: 86         # barrier
  13: 87         # bike_rack
  14: 13         # bench
  15: 88         # trash_can
  16: 10         # fire_hydrant

# YOLO id → CoDA 16-class operational id, used by scripts/eval_yolo.py
# (--mode coda16) to project YOLO predictions back into the operational
# space for direct comparison against the Phase 1-2b DETR baseline.
# Multiple YOLO ids fold into op id 5 (vehicle) — that group includes COCO
# car/bus/truck *and* the campus service_vehicle/golf_cart additions.
yolo_to_operational:
  0: 1            # person → pedestrian
  1: 2            # bicycle
  2: 5            # car → vehicle
  3: 3            # motorcycle
  5: 5            # bus → vehicle
  7: 5            # truck → vehicle
  9: 8            # traffic light
  10: 16          # fire hydrant
  13: 14          # bench
  80: 4           # scooter
  81: 6           # tree
  82: 7           # pole
  83: 9           # sign
  84: 10          # bollard
  85: 11          # cone
  86: 12          # barrier
  87: 13          # bike_rack
  88: 15          # trash_can
  89: 5           # service_vehicle → vehicle
  90: 5           # golf_cart → vehicle
