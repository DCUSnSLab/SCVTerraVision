# YOLO 91-class taxonomy = COCO80 (0..79) + CoDA campus-specific (80..90).
#
# Approved 2026-04-28 — see docs/decisions/20260428_pivot-to-yolo26.md.
# This taxonomy backs Phase 1-3 (YOLO26 fine-tune). The 16-class operational
# taxonomy in coda_taxonomy.yaml is preserved unchanged so existing CoDA-COCO
# JSON exports + 1-2b DETR checkpoints stay reproducible.
#
# Schema (consumed by training/datasets/coda_to_yolo.py):
#   version              : schema version
#   num_classes          : 91 (0..90)
#   yolo_classes         : list of {id, name} for ultralytics `names` (0..90)
#   coda_raw_to_yolo     : {CODa raw class name → YOLO id}
#                          Combines 16-class collapsing + vehicle dispatch.
#                          Raw names NOT listed and NOT in coda_dropped are
#                          rejected so a CODa update cannot silently drop
#                          classes (mirrors coda_to_coco.py's strict mode).
#   coda_dropped         : CODa raw names treated as background (no label),
#                          identical to coda_taxonomy.yaml's drop list.
#   operational_to_yolo  : {CoDA 16-class op id → YOLO id or __DISPATCH__}
#                          Used only for documentation / sanity tests.
#                          op id 5 (vehicle) → __DISPATCH__: subtype-aware
#                          lookup happens at raw-name level via
#                          coda_raw_to_yolo.
#   yolo_to_operational  : {YOLO id → CoDA 16-class op id} for eval-time
#                          reverse-mapping in --mode coda16.
version: 1
num_classes: 91

yolo_classes:
  # ---- COCO80 (0..79) — Ultralytics standard names, do not reorder ----
  - { id: 0,  name: person }
  - { id: 1,  name: bicycle }
